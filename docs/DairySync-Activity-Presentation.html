<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eaf3ff">
  <title>DairySync | Activity Flow Presentation</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #101318;
      --blue-lane: #d3e2f5;
      --green-lane: #d9e9d4;
      --orange-lane: #ffce91;
      --blue-stroke: #5b92e8;
      --green-stroke: #00c82d;
      --orange-stroke: #ff7800;
      --red-stroke: #e64949;
      --line: #111;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: #edf2f8;
      font: 15px/1.35 "Segoe UI", Arial, sans-serif;
    }

    button { font: inherit; }

    .topbar {
      position: sticky;
      z-index: 3;
      top: 0;
      display: flex;
      min-height: 60px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 9px max(16px, calc((100vw - 1000px) / 2));
      border-bottom: 1px solid #d5deea;
      background: rgba(255,255,255,.96);
      box-shadow: 0 2px 8px rgba(20,40,70,.07);
    }

    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid;
      width: 35px;
      height: 35px;
      place-items: center;
      border-radius: 50%;
      background: #d7e8ff;
      color: #225ca1;
      font-size: 19px;
      font-weight: 800;
    }
    .brand strong { display: block; font-size: 13px; letter-spacing: .06em; }
    .brand span { display: block; color: #637086; font-size: 11px; }
    .toolbar { display: flex; align-items: center; gap: 7px; }
    .counter { min-width: 46px; color: #536177; text-align: center; font-size: 12px; }
    .control {
      min-height: 34px;
      padding: 6px 11px;
      border: 1px solid #c9d4e2;
      border-radius: 7px;
      background: white;
      color: #1d2b40;
      cursor: pointer;
    }
    .control:hover { background: #f0f6ff; }
    .control:focus-visible, .dot:focus-visible { outline: 3px solid #75a8ed; outline-offset: 2px; }
    .control.primary { border-color: #3974c5; background: #3974c5; color: #fff; }
    .control:disabled { opacity: .48; cursor: default; }

    main { padding: 22px 12px 40px; }
    .deck { width: min(750px, 100%); margin: 0 auto; }
    .slide {
      overflow: hidden;
      border: 1px solid #7387a0;
      background: white;
      box-shadow: 0 7px 25px rgba(25,42,66,.15);
    }
    .slide[hidden] { display: none; }
    .activity-diagram {
      display: block;
      width: 100%;
      height: auto;
      font-family: Georgia, "Times New Roman", serif;
      background: #fff;
    }
    .diagram-title { fill: #101318; font-size: 19px; font-weight: 700; }
    .diagram-subtitle { fill: #20242a; font-size: 13px; }
    .lane-heading { fill: #101318; font-size: 12px; font-weight: 700; }
    .node-label { fill: #111; font-size: 12px; font-weight: 600; text-anchor: middle; }
    .node-small { fill: #111; font-size: 10.5px; font-weight: 400; text-anchor: middle; }
    .path-label { fill: #111; font: 11px "Segoe UI", Arial, sans-serif; font-weight: 600; }
    .annotation { fill: #273343; font: 10.5px "Segoe UI", Arial, sans-serif; }
    .task { fill: #fff; stroke-width: 1.15; }
    .task.system { stroke: var(--blue-stroke); }
    .task.user { stroke: var(--green-stroke); }
    .task.cloud { stroke: var(--orange-stroke); }
    .task.alert { fill: #ffe5e5; stroke: var(--red-stroke); }
    .decision { fill: #fff; stroke-width: 1.25; }
    .decision.system { stroke: var(--blue-stroke); }
    .decision.user { stroke: var(--green-stroke); }
    .decision.cloud { stroke: var(--orange-stroke); }
    .connector { fill: none; stroke: var(--line); stroke-width: 1.45; marker-end: url(#arrow-1); }
    .slide[data-title="Command Center"] .connector { marker-end: url(#arrow-2); }
    .slide[data-title="Inventory & production"] .connector { marker-end: url(#arrow-3); }
    .slide[data-title="Sales & commitments"] .connector { marker-end: url(#arrow-4); }
    .slide[data-title="Oversight & sync"] .connector { marker-end: url(#arrow-5); }
    .connector.no-arrow { marker-end: none; }
    .slide[data-title] .connector.no-arrow { marker-end: none; }
    .connector.dashed { stroke-dasharray: 5 4; }
    .start-dot { fill: #090909; }
    .end-ring { fill: none; stroke: #111; stroke-width: 1.4; }
    .end-dot { fill: #111; }
    .dot-separator { stroke: #222; stroke-width: 1; }

    .dots { display: flex; justify-content: center; gap: 8px; margin: 14px auto 0; }
    .dot { width: 9px; height: 9px; padding: 0; border: 0; border-radius: 50%; background: #b7c3d3; cursor: pointer; }
    .dot[aria-current="true"] { width: 24px; border-radius: 99px; background: #3974c5; }
    .footnote { margin: 12px auto 0; color: #59677a; text-align: center; font-size: 11px; }

    @media (max-width: 560px) {
      .topbar { position: static; flex-wrap: wrap; padding: 8px 12px; }
      .toolbar { width: 100%; justify-content: space-between; }
      main { padding: 10px 0 28px; }
      .slide { border-right: 0; border-left: 0; }
    }

    @media print {
      @page { size: portrait; margin: 9mm; }
      body { background: #fff; }
      .topbar, .dots, .footnote { display: none !important; }
      main { padding: 0; }
      .deck { width: 100%; }
      .slide, .slide[hidden] {
        display: block !important;
        margin: 0;
        border: 0;
        box-shadow: none;
        break-after: page;
      }
      .slide:last-child { break-after: auto; }
      .activity-diagram { width: auto; height: 255mm; max-width: 100%; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand" aria-label="DairySync activity flow presentation">
      <div class="brand-mark" aria-hidden="true">D</div>
      <div><strong>DAIRYSYNC</strong><span>Activity diagrams · 3 swimlanes</span></div>
    </div>
    <div class="toolbar" aria-label="Presentation controls">
      <button class="control" id="prev" type="button" aria-label="Previous diagram">← Back</button>
      <span class="counter" id="counter" aria-live="polite">1 / 5</span>
      <button class="control primary" id="next" type="button" aria-label="Next diagram">Next →</button>
      <button class="control" id="print" type="button" aria-label="Print or save as PDF">Print</button>
    </div>
  </header>

  <script>
    (() => {
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dots = document.querySelector(".dots");
      const counter = document.getElementById("counter");
      const previous = document.getElementById("prev");
      const next = document.getElementById("next");
      let current = 0;

      slides.forEach((slide, index) => {
        const dot = document.createElement("button");
        dot.className = "dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Go to diagram ${index + 1}: ${slide.dataset.title}`);
        dot.addEventListener("click", () => showSlide(index));
        dots.append(dot);
      });

      function showSlide(index) {
        current = (index + slides.length) % slides.length;
        slides.forEach((slide, i) => {
          slide.hidden = i !== current;
          slide.setAttribute("aria-hidden", String(i !== current));
        });
        Array.from(dots.children).forEach((dot, i) => {
          if (i === current) dot.setAttribute("aria-current", "true");
          else dot.removeAttribute("aria-current");
        });
        counter.textContent = `${current + 1} / ${slides.length}`;
        previous.disabled = current === 0;
        next.textContent = current === slides.length - 1 ? "Start over ↺" : "Next →";
        next.setAttribute("aria-label", current === slides.length - 1 ? "Start presentation over" : "Next diagram");
      }

      previous.addEventListener("click", () => showSlide(current - 1));
      next.addEventListener("click", () => showSlide(current + 1));
      document.getElementById("print").addEventListener("click", () => window.print());
      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.key === "ArrowRight" || event.key === "PageDown") showSlide(current + 1);
        if (event.key === "ArrowLeft" || event.key === "PageUp") showSlide(current - 1);
      });

      showSlide(0);
    })();
  </script>
