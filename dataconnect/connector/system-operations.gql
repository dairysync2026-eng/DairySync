query ListUserProfiles
  @auth(expr: "auth != null && auth.token.role in ['developer', 'director', 'procurement', 'plant_manager', 'production_staff', 'store_outlet']")
  @refresh(onMutationExecuted: { operation: "UpsertUserProfile" })
  @refresh(onMutationExecuted: { operation: "UpdateOwnUserProfile" })
  @refresh(onMutationExecuted: { operation: "DeleteUserProfile" }) {
  userProfiles(orderBy: [{ name: ASC }]) {
    id
    name
    role
    title
    department
    avatar
    email
    username
    nickname
  }
}

mutation UpsertUserProfile(
  $id: String!
  $name: String!
  $role: String!
  $title: String!
  $department: String!
  $avatar: String!
  $email: String!
  $username: String!
  $nickname: String
) @auth(expr: "auth != null && auth.token.role == 'developer'") {
  userProfile_upsert(data: {
    id: $id
    name: $name
    role: $role
    title: $title
    department: $department
    avatar: $avatar
    email: $email
    username: $username
    nickname: $nickname
    updatedAt_expr: "request.time"
    updatedBy_expr: "auth.uid"
  })
}

mutation UpdateOwnUserProfile(
  $id: String!
  $name: String!
  $title: String!
  $department: String!
  $avatar: String!
  $username: String!
  $nickname: String
) @auth(expr: "auth != null && auth.token.role in ['director', 'procurement', 'plant_manager', 'production_staff', 'store_outlet']") {
  userProfile_updateMany(
    where: {
      id: { eq: $id }
      email: { eq_expr: "auth.token.email" }
    }
    data: {
      name: $name
      title: $title
      department: $department
      avatar: $avatar
      username: $username
      nickname: $nickname
      updatedAt_expr: "request.time"
      updatedBy_expr: "auth.uid"
    }
  )
}

mutation DeleteUserProfile($id: String!)
  @auth(expr: "auth != null && auth.token.role == 'developer'") {
  userProfile_delete(id: $id)
}