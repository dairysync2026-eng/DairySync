query ListFinishedGoods
  @auth(expr: "auth != null && auth.token.role in ['developer', 'director', 'procurement', 'plant_manager', 'production_staff', 'store_outlet']")
  @refresh(onMutationExecuted: { operation: "UpsertFinishedGood" })
  @refresh(onMutationExecuted: { operation: "SetRetailFinishedGoodStock" })
  @refresh(onMutationExecuted: { operation: "DeleteFinishedGood" }) {
  finishedGoods(orderBy: [{ name: ASC }]) {
    id
    sku
    name
    category
    currentStock
    unit
    coldStorageCapacity
    maxThreshold
    safetyStock
    unitPrice
    allocatedFeedingProgram
    allocatedRetail
    recipe
    batchUnitQuantity
    shelfLifeDays
    location
  }
}

mutation UpsertFinishedGood(
  $id: String!
  $sku: String!
  $name: String!
  $category: String!
  $currentStock: Float!
  $unit: String!
  $coldStorageCapacity: Float!
  $maxThreshold: Float!
  $safetyStock: Float!
  $unitPrice: Float!
  $allocatedFeedingProgram: Float!
  $allocatedRetail: Float!
  $recipe: [Any!]!
  $batchUnitQuantity: Float!
  $shelfLifeDays: Int!
  $location: String!
) @auth(expr: "auth != null && auth.token.role in ['developer', 'plant_manager']") {
  finishedGood_upsert(data: {
    id: $id
    sku: $sku
    name: $name
    category: $category
    currentStock: $currentStock
    unit: $unit
    coldStorageCapacity: $coldStorageCapacity
    maxThreshold: $maxThreshold
    safetyStock: $safetyStock
    unitPrice: $unitPrice
    allocatedFeedingProgram: $allocatedFeedingProgram
    allocatedRetail: $allocatedRetail
    recipe: $recipe
    batchUnitQuantity: $batchUnitQuantity
    shelfLifeDays: $shelfLifeDays
    location: $location
    updatedAt_expr: "request.time"
    updatedBy_expr: "auth.uid"
  })
}

mutation SetRetailFinishedGoodStock(
  $id: String!
  $currentStock: Float!
  $allocatedRetail: Float!
) @auth(expr: "auth != null && auth.token.role in ['developer', 'plant_manager', 'store_outlet']") {
  finishedGood_update(id: $id, data: {
    currentStock: $currentStock
    allocatedRetail: $allocatedRetail
    updatedAt_expr: "request.time"
    updatedBy_expr: "auth.uid"
  })
}

mutation DeleteFinishedGood($id: String!)
  @auth(expr: "auth != null && auth.token.role in ['developer', 'plant_manager']") {
  finishedGood_delete(id: $id)
}

